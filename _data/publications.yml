# All publications of the lab, newest first within each type.
# This single file feeds the Publications page, the Research page and the CV page.
#
# Fields
#   id      : unique key
#   type    : journal | conference
#   title   : paper title
#   authors : author list ("*" marks corresponding authors; "Axiu Mao" is bolded automatically)
#   venue   : full venue name          tag: short venue tag shown as a badge
#   year    : publication year         note: optional extra info (volume, status, ...)
#   url     : link to the paper        code: link to the code (both optional)
#   image   : thumbnail in /images/pubs/ (optional)
#   topics  : research topics the paper belongs to (ids defined in _data/research.yml)
#   media   : optional list of press coverage (name + url)

